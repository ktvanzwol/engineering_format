[project]
name = "engineering-format"
version = "0.1.0"
description = "SI/metric prefix formatting and parsing for Python"
readme = "README.md"
authors = [
    { name = "Karsten van Zwol", email = "karsten.van.zwol@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
keywords = [
    "engineering notation",
    "si prefix",
    "metric prefix",
    "formatting",
    "parsing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/ktvanzwol/engineering_format"
Repository = "https://github.com/ktvanzwol/engineering_format"
Issues = "https://github.com/ktvanzwol/engineering_format/issues"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.coverage.run]
omit = [
    "tests/*",
]
