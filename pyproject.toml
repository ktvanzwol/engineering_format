[project]
name = "engineering-format"
version = "0.1.0"
description = "SI/metric prefix formatting and parsing for Python"
readme = "README.md"
authors = [
    { name = "Karsten van Zwol", email = "karsten.van.zwol@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
license = { text = "MIT" }

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.coverage.run]
omit = [
    "tests/*",
]
